<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>SSQE - Gestão SIP | John Deere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <!-- Chart.js (used by the NC page) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- SheetJS – Excel export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }

    html { overflow-x:hidden; }
    body { display:flex; background:#f4f6f0; min-height:100vh; overflow-x:hidden; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position:relative;
      width:240px; min-width:240px; background:#2d3340; color:white;
      padding:24px 16px; display:flex; flex-direction:column; gap:8px;
      transition:width .25s ease, min-width .25s ease, padding .25s ease;
      overflow:hidden;
    }
    .sidebar-logo {
      display:flex; align-items:center; gap:10px;
      padding:0 8px 24px; border-bottom:1px solid rgba(255,255,255,.15);
    }
    .sidebar-logo .logo-icon {
      width:64px; height:64px; background:#FFDE00; border-radius:10px;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .sidebar-logo h2 { font-size:15px; font-weight:700; line-height:1.3; color:#fff; }
    .sidebar-logo span { font-size:11px; color:#9ca3af; }
    .sidebar-logo .logo-initials { font-size:26px; font-weight:900; color:#0A2008; letter-spacing:-1px; text-transform:uppercase; transition:font-size .12s; }
    .sidebar-nav { margin-top:16px; list-style:none; display:flex; flex-direction:column; gap:4px; }
    .sidebar-nav li[data-page] {
      padding:10px 12px; border-radius:8px; cursor:pointer;
      display:flex; align-items:center; gap:10px; font-size:14px;
      color:#c4c9d4; transition:background .15s, color .15s;
      white-space:nowrap; overflow:hidden;
    }
    .sidebar-nav li[data-page] .nav-icon { width:18px; text-align:center; flex-shrink:0; }
    .sidebar-nav li[data-page].active { background:var(--tenant-nav-active-bg,#FFDE00); color:var(--tenant-nav-active-text,#0A2008); font-weight:700; }
    .sidebar-nav li[data-page]:not(.active):hover { background:rgba(255,255,255,.1); color:white; }
    .sidebar-nav > li.nav-group { padding:0; display:block; cursor:default; }
    .sidebar-nav > li.nav-group:hover { background:none; }
    .nav-group { display:flex; flex-direction:column; gap:2px; }
    .nav-group-header {
      display:flex; align-items:center; gap:8px;
      padding:7px 10px; border-radius:8px; cursor:pointer;
      font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
      color:rgba(255,255,255,.55); user-select:none;
      transition:background .15s, color .15s;
    }
    .nav-group-header:hover { background:rgba(255,255,255,.08); color:rgba(255,255,255,.85); }
    .nav-group-header .nav-group-arrow {
      margin-left:auto; transition:transform .2s; font-size:9px; opacity:.7;
    }
    .nav-group.open .nav-group-header .nav-group-arrow { transform:rotate(90deg); }
    .nav-group-items { display:none; flex-direction:column; gap:3px; padding-left:10px; list-style:none; }
    .nav-group.open .nav-group-items { display:flex; }
    .nav-group-items li[data-page] { font-size:13px; }
    .nav-group-items.nav-group-items--raw { padding-left:2px; }
    .sidebar-nav > li + li {
      border-top:1px solid rgba(255,255,255,.12);
      margin-top:6px; padding-top:6px;
    }
    .sidebar-project-item {
      display:flex; align-items:center; gap:7px; padding:5px 8px;
      border-radius:6px; cursor:pointer; font-size:11px; font-weight:600;
      color:rgba(255,255,255,.7); transition:background .12s; white-space:nowrap; overflow:hidden;
    }
    .sidebar-project-item:hover { background:rgba(255,255,255,.08); color:#fff; }
    .sidebar-project-item.active { background:rgba(255,255,255,.14); color:#fff; }
    .sidebar-project-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; background:rgba(255,255,255,.35); }
    .sidebar.collapsed .nav-group-header { padding:10px; justify-content:center; gap:0; }
    .sidebar.collapsed .nav-group-header .nav-group-label,
    .sidebar.collapsed .nav-group-header .nav-group-arrow { display:none; }
    .sidebar.collapsed .nav-group-items { display:none !important; }
    .sidebar.collapsed .nav-group-header { position:relative; }
    .sidebar.collapsed .nav-group-header::after {
      content:attr(data-tooltip);
      position:absolute; left:calc(100% + 10px); top:50%;
      transform:translateY(-50%);
      background:rgba(0,0,0,.8); color:#fff;
      font-size:12px; white-space:nowrap; padding:4px 8px;
      border-radius:5px; pointer-events:none;
      opacity:0; transition:opacity .15s; z-index:200;
    }
    .sidebar.collapsed .nav-group-header:hover::after { opacity:1; }
    .sidebar-footer { margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,.12); font-size:11px; color:#9ca3af; text-align:center; }
    .sidebar-toggle-btn {
      position:absolute; top:14px; right:8px;
      width:26px; height:26px; border-radius:50%;
      background:rgba(255,255,255,.15);
      border:1.5px solid rgba(255,255,255,.25);
      color:rgba(255,255,255,.85); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .15s;
      z-index:10; flex-shrink:0;
    }
    .sidebar-toggle-btn:hover { background:rgba(255,255,255,.3); }
    .sidebar-toggle-btn svg { transition:transform .25s; flex-shrink:0; }
    .sidebar.collapsed .sidebar-toggle-btn { right:auto; left:50%; transform:translateX(-50%); top:14px; }
    .sidebar.collapsed .sidebar-toggle-btn svg { transform:rotate(180deg); }
    .sidebar.collapsed { width:56px; min-width:56px; padding:24px 8px; }
    .sidebar.collapsed .sidebar-logo { padding-bottom:18px; justify-content:center; padding-top:28px; }
    .sidebar.collapsed .sidebar-logo > div:not(.logo-icon) { display:none; }
    .sidebar.collapsed .sidebar-logo .logo-icon { width:40px; height:40px; border-radius:8px; }
    .sidebar.collapsed .logo-initials { font-size:16px; }
    .sidebar.collapsed .sidebar-nav li[data-page] { padding:10px; justify-content:center; gap:0; position:relative; }
    .sidebar.collapsed .sidebar-nav li[data-page] .nav-label { display:none; }
    .sidebar.collapsed .sidebar-nav li[data-page]::after {
      content:attr(data-tooltip);
      position:absolute; left:calc(100% + 10px); top:50%;
      transform:translateY(-50%);
      background:rgba(0,0,0,.8); color:#fff;
      font-size:12px; white-space:nowrap; padding:4px 8px;
      border-radius:5px; pointer-events:none;
      opacity:0; transition:opacity .15s;
      z-index:200;
    }
    .sidebar.collapsed .sidebar-nav li[data-page]:hover::after { opacity:1; }
    .sidebar.collapsed .sidebar-footer { padding-top:12px; }
    .sidebar.collapsed .sidebar-footer .firebase-status-btn { padding:7px; justify-content:center; }
    .sidebar.collapsed .sidebar-footer .firebase-status-btn > span:last-of-type,
    .sidebar.collapsed .sidebar-footer .firebase-status-btn > svg:last-child,
    .sidebar.collapsed .sidebar-footer #firebaseStatusLabel { display:none; }
    .sidebar.collapsed .sidebar-footer > :last-child { display:none; }
    body:has(.sidebar.collapsed) .main { flex:1; }
    .firebase-status-btn {
      display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.15); color:rgba(255,255,255,.7);
      border-radius:8px; padding:7px 10px; font-size:12px; cursor:pointer;
      transition:background .15s, color .15s; width:100%; margin-bottom:8px;
    }
    .firebase-status-btn:hover { background:rgba(255,255,255,.18); color:#fff; }
    .firebase-status-dot {
      width:8px; height:8px; border-radius:50%; flex-shrink:0;
      background:#9ca3af; transition:background .3s;
    }
    .firebase-status-dot.connected { background:#22c55e; box-shadow:0 0 6px #22c55e; }
    .firebase-status-dot.error     { background:#ef4444; }
    .firebase-status-dot.pending   { background:#f59e0b; animation:fbpulse 1s infinite; }
    @keyframes fbpulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .main { flex:1; min-width:0; padding:28px 32px; overflow:auto; }
  </style>
</head>
<body>
  <div class="main">
    <h1>Correção em andamento</h1>
    <p>Este arquivo foi temporariamente atualizado pelo assistente para evitar falhas de mídia do Firebase Storage.</p>
  </div>

  <script>
    function isHttpUrl(value) {
      return typeof value === 'string' && /^https?:\/\//i.test(value);
    }

    function isFirebaseStorageNotFoundError(error) {
      if (!error) return false;
      const code = String(error.code || '').toLowerCase();
      const message = String(error.message || '').toLowerCase();
      return code.includes('storage/object-not-found') || code.includes('object-not-found') || message.includes('not found') || message.includes('404');
    }

    async function resolveStorageUrlSafe(fileValue) {
      if (!fileValue || typeof fileValue !== 'string') return null;
      const value = fileValue.trim();
      if (!value) return null;
      if (isHttpUrl(value)) return value;
      try {
        const storageRef = firebase.storage().ref(value);
        return await storageRef.getDownloadURL();
      } catch (error) {
        if (isFirebaseStorageNotFoundError(error)) {
          console.warn('[SPI] Arquivo não encontrado no Firebase Storage:', value);
          return null;
        }
        console.error('[SPI] Erro ao resolver arquivo no Storage:', value, error);
        return null;
      }
    }

    async function resolveManyStorageUrlsSafe(items) {
      if (!Array.isArray(items)) return [];
      const results = await Promise.all(items.map(async item => resolveStorageUrlSafe(item)));
      return results.filter(Boolean);
    }

    window.resolveStorageUrlSafe = resolveStorageUrlSafe;
    window.resolveManyStorageUrlsSafe = resolveManyStorageUrlsSafe;
  </script>
</body>
</html>
